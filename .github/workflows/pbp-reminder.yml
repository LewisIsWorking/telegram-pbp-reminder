name: PBP Inactivity Reminder

on:
  schedule:
    # ⛔ MINUTES ARE DELIBERATELY NOT :00 AND :30. Changed 2026-08-31.
    #
    # GitHub's own docs: "The schedule event can be delayed during periods
    # of high loads of GitHub Actions workflow runs. High load times
    # include the start of every hour." :00 and :30 are the two most
    # contended minutes on the platform, and we were asking for both.
    #
    # Measured over 2026-08-23 to 08-31: 173 scheduled runs delivered of
    # 372 requested, a 46% delivery rate, with 13 gaps over three hours
    # and a worst gap of 11h. Per day it fell off a cliff:
    #     08-23  45    08-27  5     08-30  12
    #     08-24  41    08-28  4     08-31   2
    #     08-25  45    08-29  10
    # Every run that did fire pushed state successfully, so nothing was
    # broken here; the runs simply never happened. The visible symptom
    # was preflight pausing posting because the heartbeat aged past 3h
    # (see preflight/prior_runs.py, which cannot tell a dropped run from
    # a failed push).
    #
    # Hourly full pass: messages, inactivity, and the ~28 scheduled
    # features.
    - cron: '13 * * * *'
    # Half-past: lightweight queue-only pass. Ingests updates so GM
    # reply-to clears show up within ~30 min instead of ~60, without
    # firing the other features. See the run-queue job.
    #
    # ⚠️ Keep these exactly 30 minutes apart. The gap, not the absolute
    # minute, is what the queue-latency promise above rests on.
    - cron: '43 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  # Added 2026-08-27. Until now NOTHING ran the tests before a merge, so
  # every guard in the suite gated nothing: PR #64 committed a queue file
  # built entirely from test fixtures and merged green. Only the `test`
  # job may run for this event; see the run job's condition.
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for testing

concurrency:
  group: pbp-checker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: >-
      github.event_name == 'push'
      || github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        # pyyaml is for test_workflow_cannot_post_from_a_pr.py, which
        # parses this file and asserts the job conditions.
        run: pip install requests pytest pytest-cov tzdata pyyaml

      # ⛔⛔ THE REAL TOKEN IS DELIBERATELY NOT HERE. Split from the
      # alert step on 2026-09-04, after the suite posted 14 fixture-filled
      # diagnostics into the live debug topic across two CI runs. The
      # sending code returns early with no token, so on a developer
      # machine the leaking tests could not fail even in principle; this
      # step handed them a real one.
      #
      # scripts/_test_no_real_network.py blocks the calls outright and is
      # the actual guard. This is the second lock: even if that were
      # bypassed, there is no credential here to misuse. The obviously
      # fake value keeps the code path identical to production so the
      # blocker is still exercised.
      - name: Run tests
        id: tests
        env:
          TELEGRAM_BOT_TOKEN: ci-token-never-valid
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python -m pytest scripts/ -q --cov=scripts --cov-config=.coveragerc --cov-report=term-missing 2>&1 | tee /tmp/pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          exit $EXIT_CODE

      # Only this step gets the real credential, and it runs no tests.
      - name: Alert on test failure
        if: failure() && steps.tests.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/ci_alert.py

      # ⛔ The backstop for every write path nobody has enumerated.
      #
      # scripts/test_tests_never_touch_real_data.py checks the writers we
      # KNOW about, one test per module. This checks the invariant itself:
      # a test run must leave data/ and config.json untouched, whatever
      # module did the writing and whether or not anyone remembered to
      # add it to _test_state_isolation.
      #
      # Written after test fixtures reached the group as 43 imaginary
      # messages from a player who does not exist. The suite had been
      # writing real transcripts and real queue files for months.
      - name: Fail if the test run modified real data
        run: |
          DIRTY=$(git status --porcelain data/ config.json)
          if [ -n "$DIRTY" ]; then
            echo "::error::The test suite modified files under data/."
            echo "$DIRTY"
            echo ""
            echo "Something wrote to the real tree instead of the session"
            echo "tmp dir. Add it to scripts/_test_state_isolation.py."
            git --no-pager diff --stat data/ config.json
            exit 1
          fi
          echo "data/ and config.json untouched by the test run."

  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      # actions:read is what lets the preflight gate see how previous runs
      # ended (2026-08-19). Without it the API returns 403, the gate fails
      # open, and it is disarmed without ever saying so.
      actions: read
    # Both crons trigger this workflow, so the full pass must exclude the
    # :30 queue-only schedule. Push and workflow_dispatch still run the
    # full pass exactly as before.
    #
    # ⛔ REWRITTEN 2026-08-27 from a denylist to an allowlist. It read
    # `github.event_name != 'schedule' || ...`, which opts IN every
    # trigger type anyone adds later. Adding the pull_request trigger
    # above would therefore have made this job run on every PR, and this
    # job posts to Telegram, writes state and pushes commits. A condition
    # phrased as "not X" is a standing invitation for exactly that.
    #
    # ⛔⛔ THESE CRON STRINGS MUST MATCH THE `schedule:` BLOCK EXACTLY.
    # Broken 2026-08-31 by PR #75, which moved the crons off the
    # contended :00/:30 minutes and left these comparisons pointing at
    # the old ones. Both jobs' conditions went false on every scheduled
    # run, GitHub reported the whole workflow as **skipped** rather than
    # failed, and the bot silently stopped for 15 hours. Nothing was red.
    # test_schedule_conditions_match_the_crons.py fails if they diverge
    # again.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule' && github.event.schedule == '13 * * * *')
    steps:
      # `ref: main` instead of the default (which checks out GITHUB_SHA,
      # the SHA that triggered the workflow). When the concurrency group
      # `pbp-checker` serialises runs, Run B (queued behind Run A) MUST
      # check out main HEAD so it picks up Run A's state push. The default
      # pins to the trigger SHA which was set BEFORE Run A finished —
      # that stale checkout is what caused the 2026-05-11 duplicate-post-
      # of-#360 incident. See L21 in docs/dev/REFACTOR_PROGRESS.md.
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests pytest pytest-cov tzdata

      # Pause posting when state is not reaching the remote (2026-08-19).
      # On 2026-08-18 `main` gained branch protection, the commit step
      # started failing with GH006, and 25 runs in a row reloaded the same
      # frozen state and re-posted the same queue notice. Nothing noticed
      # for 15 hours. A message the bot cannot record becomes a permanent
      # orphan after 48h, so silence is the safe direction here.
      #
      # ⚠️ This step must NOT fail the job. The commit step below still
      # has to run, because a push that succeeds is what turns the run
      # green and reopens the gate. See scripts/preflight/prior_runs.py.
      - name: Preflight - can the bot still record what it sends?
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts && python -m preflight.gate

      - name: Update bot command menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts && python set_commands.py

      - name: Run inactivity checker
        if: steps.preflight.outputs.halt != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: cd scripts && python checker.py

      - name: Alert on delete refusals
        if: steps.preflight.outputs.halt != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: cd scripts && python refusal_alert.py

      - name: Commit data (archive + transcripts + state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data
          cp -f data/weekly_archive.json docs/data/weekly_archive.json 2>/dev/null || true
          python scripts/promote_poll_voters.py --commit 2>/dev/null || true
          git add data/ docs/data/ config.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Update archive, transcripts and state [skip ci]"
          # Retry-with-rebase on non-fast-forward. Pre-2026-05-11 this
          # was `git push || echo "Nothing to push"` which silently
          # swallowed non-fast-forward errors, losing state updates
          # whenever runs raced (e.g. two pushes ~30s apart triggering
          # back-to-back runs). The duplicate post that Lewis flagged
          # was the visible half; the silent state loss was the worse
          # half. Now we fail loudly if 5 rebase+push attempts can't
          # land the state. See L21 in docs/dev/REFACTOR_PROGRESS.md.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "State push succeeded on attempt $i"
              exit 0
            fi
            if [ $i -eq 5 ]; then
              echo "ERROR: state push failed after 5 attempts" >&2
              exit 1
            fi
            echo "Push attempt $i failed; rebasing onto origin/main and retrying..."
            if ! git pull --rebase origin main; then
              echo "ERROR: rebase failed — likely merge conflict in state files" >&2
              exit 1
            fi
          done

  # Lightweight half-hourly pass: process Telegram updates (so GM reply-to
  # clears register within ~30 min) and refresh the queue only. Deliberately
  # skips set_commands, refusal_alert and the other ~28 scheduled features so
  # the extra cadence costs one short run rather than a second full pass.
  run-queue:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      actions: read  # for the preflight gate; see the `run` job
    # ⛔ Must match the second cron in the `schedule:` block. See the
    # note on the `run` job: a mismatch here skips silently.
    if: github.event_name == 'schedule' && github.event.schedule == '43 * * * *'
    steps:
      # Same `ref: main` rule as the full run: the pbp-checker concurrency
      # group serialises runs, so this must check out main HEAD to pick up
      # the previous run's state push rather than the stale trigger SHA.
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install requests tzdata

      # Same gate as the full run. This job is the one that posted the
      # four duplicate "Unreplied: 1" notices on 2026-08-19, so leaving it
      # ungated would have left the reported symptom entirely in place.
      - name: Preflight - can the bot still record what it sends?
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts && python -m preflight.gate

      - name: Run queue-only checker
        if: steps.preflight.outputs.halt != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: cd scripts && python checker.py --queue-only

      - name: Commit data (archive + transcripts + state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ config.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Update queue state [skip ci]"
          # Same retry-with-rebase contract as the full run. The offset was
          # advanced by get_updates, so failing to land this push would
          # silently lose the updates this run consumed.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "State push succeeded on attempt $i"
              exit 0
            fi
            if [ $i -eq 5 ]; then
              echo "ERROR: state push failed after 5 attempts" >&2
              exit 1
            fi
            echo "Push attempt $i failed; rebasing onto origin/main and retrying..."
            if ! git pull --rebase origin main; then
              echo "ERROR: rebase failed — likely merge conflict in state files" >&2
              exit 1
            fi
          done
