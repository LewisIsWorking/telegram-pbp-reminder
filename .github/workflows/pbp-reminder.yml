name: PBP Inactivity Reminder

on:
  schedule:
    # Run every hour to process messages and check for inactivity
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

concurrency:
  group: pbp-checker
  cancel-in-progress: false

jobs:
  check-inactivity:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytest pytest-cov

      - name: Run tests
        run: python -m pytest scripts/ -q --cov=scripts --cov-config=.coveragerc --cov-report=term-missing

      - name: Update bot command menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts && python set_commands.py

      - name: Run inactivity checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: cd scripts && python checker.py

      - name: Commit data (archive + transcripts + state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data
          cp -f data/weekly_archive.json docs/data/weekly_archive.json 2>/dev/null || true
          cd scripts && python promote_poll_voters.py --commit || true && cd ..
          git add data/ docs/data/ config.json
          git diff --cached --quiet || git commit -m "Update archive, transcripts and state [skip ci]"
          git push || echo "Nothing to push"
