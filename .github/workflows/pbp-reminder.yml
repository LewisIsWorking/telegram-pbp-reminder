name: PBP Inactivity Reminder

on:
  schedule:
    # Run every hour to process messages and check for inactivity
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger for testing

concurrency:
  group: pbp-checker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytest pytest-cov

      - name: Run tests and alert on failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python -m pytest scripts/ -q --cov=scripts --cov-config=.coveragerc --cov-report=term-missing 2>&1 | tee /tmp/pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            python3 -c "
          import os, requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          sha = os.environ.get('GITHUB_SHA', '?')[:8]
          # Extract failed test names and coverage misses
          try:
              raw = open('/tmp/pytest_output.txt').read()
              lines = raw.splitlines()
              failed = [l for l in lines if l.startswith('FAILED ')]
              missing = [l for l in lines if 'MISSING' in l or ('Miss' in l and '%' in l)]
              summary = []
              if failed:
                  summary.append('Failed tests:')
                  summary.extend(f'  {l}' for l in failed[:10])
              if missing and not failed:
                  summary.append('Coverage gaps:')
                  summary.extend(f'  {l.strip()}' for l in missing[:5])
              detail = '
'.join(summary) if summary else '(see GitHub Actions for details)'
          except Exception as e:
              detail = f'(could not read output: {e})'
          import sys
          sys.path.insert(0, 'scripts')
          from helpers_pkg.config import load_config
          config = load_config()
          gid = config['group_id']
          tid = config.get('bot_topic_id')
          if tid:
              text = f'\u26a0\ufe0f Tests failed on push (sha: {sha})\n\n{detail}'
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id': gid, 'message_thread_id': tid, 'text': text})
          "
          fi

  run:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytest pytest-cov

      - name: Update bot command menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: cd scripts && python set_commands.py

      - name: Run inactivity checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: cd scripts && python checker.py

      - name: Commit data (archive + transcripts + state)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/data
          cp -f data/weekly_archive.json docs/data/weekly_archive.json 2>/dev/null || true
          python scripts/promote_poll_voters.py --commit 2>/dev/null || true
          git add data/ docs/data/ config.json
          git diff --cached --quiet || git commit -m "Update archive, transcripts and state [skip ci]"
          git push || echo "Nothing to push"
