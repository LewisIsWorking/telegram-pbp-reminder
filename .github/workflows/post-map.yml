# 🗺️ Post one character's battle map on request (2026-11-20). A /map sent through the say endpoint is never seen
# (Telegram does not deliver a bot's own messages back to it), so this runs the post instead, in two steps:
#   1. gh workflow run post-map.yml -f mode=preview -f code=C06 -f name=Zerius
#      draws the map, uploads it as the "map" artifact and prints its sha256. Posts nothing. Show Lewis the file.
#   2. gh workflow run post-map.yml -f mode=post -f code=C06 -f name=Zerius -f expect=SHA [-f reply_to=ID] [-f text=...]
#      draws it again and posts it only if it is byte for byte the approved picture.
# Lewis, 2026-11-20: "You NEED to show me the map before you ever post it." Writes no state.
name: Post a map

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (upload only) or post (needs expect)'
        required: true
        default: preview
        type: choice
        options: [preview, post]
      code:
        description: 'Campaign code, e.g. C06'
        required: true
      name:
        description: 'Whose view (one character, never the party), e.g. Zerius'
        required: true
      expect:
        description: 'post only: the sha256 the preview printed, of the picture Lewis approved'
        required: false
        default: ''
      reply_to:
        description: 'post only: message id to reply to in the combat topic (optional)'
        required: false
        default: '0'
      text:
        description: 'post only: GM text under the caption, \n for a new line (optional)'
        required: false
        default: ''

jobs:
  map:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install requests tzdata pillow
      - name: Draw, and post if approved
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PATHWARS_BOT_READ_KEY: ${{ secrets.PATHWARS_BOT_READ_KEY }}
          MAP_MODE: ${{ inputs.mode }}
          MAP_CODE: ${{ inputs.code }}
          MAP_NAME: ${{ inputs.name }}
          MAP_EXPECT: ${{ inputs.expect }}
          MAP_REPLY: ${{ inputs.reply_to }}
          MAP_TEXT: ${{ inputs.text }}
        run: cd scripts && python -m combat.post_map_once "$MAP_MODE" "$MAP_CODE" "$MAP_NAME" --expect "$MAP_EXPECT" --reply-to "$MAP_REPLY" --text "$MAP_TEXT"
      - name: Upload the preview
        if: inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: map
          path: map.jpg
