name: Bot Watchdog

# ⛔⛔ A SEPARATE FILE ON PURPOSE. THE WATCHDOG MUST NOT LIVE INSIDE THE
# THING IT WATCHES.
#
# 2026-08-31 21:28 to 09-01 12:43: pbp-reminder.yml's crons said :13/:43
# while both job conditions still said :00/:30. No job's `if:` was ever
# true, GitHub marked every run **skipped**, and the bot was down for 15
# hours with nothing red anywhere. The preflight gate that exists to
# catch that runs INSIDE those jobs, so it never executed.
#
# The first fix put a watchdog job in pbp-reminder.yml. That covers a
# mis-gated job but NOT a broken `on:` block: a YAML error or a bad cron
# there means nothing in the file runs at all, watchdog included.
#
# ⭐ So it lives here, with its own schedule, and shares nothing with the
# workflow it monitors except the repository.
#
# Minutes deliberately unlike the main workflow's :13/:43, and off the
# contended :00/:30 for the reason documented there.

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      debug_ping:
        description: 'Send one test report to the "The Bot is Dead" debug topic and stop'
        type: boolean
        default: false

# ⚠️ NOT in the `pbp-checker` concurrency group. Sharing it would let a
# stuck main run block the watchdog, which is precisely when it is needed.
concurrency:
  group: bot-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      # ⛔ Read only. The watchdog must never be able to write a
      # heartbeat: doing so would refresh the very signal that proves the
      # outage, and it would then report health forever while nothing
      # else ran.
      contents: read
      # ⛔⛔ actions: WRITE, corrected 2026-09-02. This was `read`, and the
      # self-repair fired for real on the outage it was built for and got
      # HTTP 403. I had assumed GITHUB_TOKEN could not start a run at all
      # and reached for a PAT. GitHub's docs say the opposite:
      #
      #   "events triggered by the GITHUB_TOKEN will not create a new
      #    workflow run, with the following exceptions: workflow_dispatch
      #    and repository_dispatch events always create workflow runs."
      #
      # So the automatic token works, needs no setup by anyone, and only
      # ever needed this one line.
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - run: pip install requests

      # ⭐ Proves the debug channel on demand. A wrong debug_topic_id is
      # invisible until the next outage, which is the worst moment to
      # discover the alerting was never wired. `if:` guards BOTH steps so
      # a ping run does not also dispatch a repair.
      - name: Debug-topic ping
        if: ${{ inputs.debug_ping }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cd scripts && python -m preflight.gate --debug-ping

      - name: Is the bot still running, and restart it if not
        if: ${{ !inputs.debug_ping }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⭐ Kept only as a FALLBACK, for a repository whose default
          # token permissions are locked down. GITHUB_TOKEN above is the
          # primary and needs no setup by anyone; see the permissions
          # block. Order is asserted by test_the_bot_restarts_itself.
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: cd scripts && python -m preflight.gate --watch
